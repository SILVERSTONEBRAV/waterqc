<div
    class="ca-drawer-root"
    id="ca-drawer-root"
    hidden
    aria-hidden="true"
>
    <div class="ca-drawer-backdrop" data-action="close-drawer"></div>

    <aside
        class="ca-drawer"
        id="ca-drawer"
        role="dialog"
        aria-modal="true"
    >
        <div class="ca-drawer-header">
            <div>
                <h2 id="ca-drawer-title"></h2>
                <p id="ca-drawer-subtitle"></p>
            </div>

            <button
                type="button"
                class="ca-icon-button"
                data-action="close-drawer"
                aria-label="Close"
            >
                <span class="ca-icon ca-icon-close"></span>
            </button>
        </div>

        <div class="ca-drawer-body" id="ca-drawer-body"></div>

        <div class="ca-drawer-footer" id="ca-drawer-footer"></div>
    </aside>
</div>
