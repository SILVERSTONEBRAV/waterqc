
<article class="ca-stat-card ca-stat-{{ tone|default:'primary' }}">
    <div class="ca-stat-card-top">
        <span class="ca-stat-icon">
            <span class="ca-icon ca-icon-{{ icon|default:'activity' }}"></span>
        </span>

        {% if change is not None %}
            <span class="ca-stat-change {% if change >= 0 %}is-positive{% else %}is-negative{% endif %}">
                {% if change >= 0 %}+{% endif %}{{ change }}%
            </span>
        {% endif %}
    </div>

    <div class="ca-stat-value">
        {{ value|default:0 }}
    </div>

    <div class="ca-stat-label">
        {{ label }}
    </div>

    {% if href %}
        <a href="{{ href }}" class="ca-stat-link">
            View details
            <span class="ca-icon ca-icon-arrow-right"></span>
        </a>
    {% endif %}
</article>
