<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My App{% endblock %}</title>

    <!-- CSRF Token for JS fetch -->
    <meta name="csrf-token" content="{{ csrf_token }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-G1XaZhN0wE23F8lfy0jXvZqR4Vg1zVG+z4hF3GqkpB5y8DJxn3+ZnQ0XrAq+f8RV" crossorigin="anonymous">

    <!-- Optional FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-vc+zj6wIlvsy/uMZ5Pb8Q7Z9d2FOVnU15SChlE0YhSSTV+F9k0bGxWZgF3e0+wGShb8FzGZz5/7AKz5j7H4UQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom styles -->
    {% block extra_styles %}{% endblock %}
</head>
<body class="bg-light">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">My App</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<!-- ================= MAIN CONTENT ================= -->
<main class="container-fluid">
    {% block content %}{% endblock %}
</main>

<!-- ================= FOOTER ================= -->
<footer class="footer mt-auto py-3 bg-dark text-white text-center">
    <div class="container">
        &copy; {{ now|date:"Y" }} My App. All rights reserved.
    </div>
</footer>

<!-- ================= SCRIPTS ================= -->
<!-- Bootstrap Bundle JS (Popper included) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-LDf0H7d0B2+oZk2aQO7KrRZ4aR8r+4iE1f9ZlHT+lX8i0f2lE+RaO9cC1E43o0cG" crossorigin="anonymous"></script>

<!-- Optional jQuery if needed -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-4kLwb3n5hpGz5nHfR6GZk6pQ3eMwQWxQ+G2aDtm6w90=" crossorigin="anonymous"></script>

<!-- Custom scripts -->
{% block extra_scripts %}{% endblock %}

</body>
</html>
