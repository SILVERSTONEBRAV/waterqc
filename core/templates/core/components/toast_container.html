<div id="toast-container"
     class="pointer-events-none fixed top-6 right-6 z-[9998] flex w-full max-w-sm flex-col gap-4">

    <template id="toast-template">

        <div
            class="pointer-events-auto relative overflow-hidden rounded-2xl border bg-white shadow-2xl transition-all duration-300 opacity-0 translate-x-8">

            <div class="absolute left-0 top-0 h-full w-1 toast-accent bg-blue-600"></div>

            <div class="flex items-start gap-4 px-5 py-4">

                <div class="toast-icon flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full bg-blue-100 text-blue-700">

                    <svg class="h-5 w-5"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M13 16h-1v-4h-1m1-4h.01M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>

                    </svg>

                </div>

                <div class="min-w-0 flex-1">

                    <h4 class="toast-title text-sm font-semibold text-slate-900">

                        Notification

                    </h4>

                    <p class="toast-message mt-1 text-sm leading-relaxed text-slate-600">

                    </p>

                </div>

                <button
                    type="button"
                    class="toast-close rounded-lg p-1 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700">

                    <svg class="h-5 w-5"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M6 18L18 6M6 6l12 12"/>

                    </svg>

                </button>

            </div>

            <div class="h-1 w-full bg-slate-100">

                <div class="toast-progress h-full w-full origin-left bg-blue-600"></div>

            </div>

        </div>

    </template>

</div>
