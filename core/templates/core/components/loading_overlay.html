<div id="global-loading"
     class="htmx-indicator fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/30 backdrop-blur-sm">

    <div class="w-full max-w-sm rounded-3xl border border-slate-200 bg-white shadow-2xl">

        <div class="flex flex-col items-center px-8 py-8">

            <div class="relative flex h-16 w-16 items-center justify-center">

                <svg class="absolute h-16 w-16 animate-spin text-blue-600"
                     xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24">

                    <circle
                        class="opacity-20"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4">
                    </circle>

                    <path
                        class="opacity-90"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
                    </path>

                </svg>

                <svg class="h-7 w-7 text-blue-700"
                     xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M9 12l2 2 4-4"/>

                </svg>

            </div>

            <h3 class="mt-6 text-lg font-bold text-slate-900">
                Processing Request
            </h3>

            <p class="mt-2 text-center text-sm leading-relaxed text-slate-500">
                Please wait while the laboratory system processes your request.
            </p>

            <div class="mt-6 h-2 w-full overflow-hidden rounded-full bg-slate-200">

                <div class="h-full w-full origin-left animate-pulse rounded-full bg-gradient-to-r from-blue-600 via-sky-500 to-cyan-400">
                </div>

            </div>

        </div>

    </div>

</div>
