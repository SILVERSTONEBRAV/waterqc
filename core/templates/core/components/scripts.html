{% load static %}

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js" defer></script>

<script>
window.APP = {
    debug: {{ debug|default:False|yesno:"true,false" }},
    csrfToken: "{{ csrf_token }}",

    urls: {
        websocket: "{% if request.is_secure %}wss{% else %}ws{% endif %}://{{ request.get_host }}/ws/qc/dashboard/",
    },

    events: {
        ANALYSIS_CREATED: "analysis-created",
        ANALYSIS_UPDATED: "analysis-updated",
        ANALYSIS_DELETED: "analysis-deleted",
        RESULT_CREATED: "result-created",
        RESULT_UPDATED: "result-updated",
        RESULT_CONFIRMED: "result-confirmed",
        REFRESH: "refresh",
        NOTIFY: "notify"
    }
};

window.dispatchAppEvent = function(name, detail = {}) {
    window.dispatchEvent(
        new CustomEvent(name, { detail })
    );
};
</script>
