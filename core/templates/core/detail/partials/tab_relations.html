<div class="card shadow-sm">

    <div class="card-header d-flex justify-content-between">
        <span>Linked Records</span>

        <button class="btn btn-sm btn-primary js-action"
                data-action="create-child"
                data-parent="{{ object.pk }}"
                data-model="{{ meta.key }}">
            ➕ Add Child
        </button>
    </div>

    <div class="card-body">

        {% for rel in reverse_relations %}

        <div class="mb-3 border rounded p-2">

            <div class="d-flex justify-content-between align-items-center mb-2">

                <strong>{{ rel.label }} ({{ rel.count }})</strong>

                <button class="btn btn-sm btn-outline-primary js-load-relation"
                        data-model="{{ meta.app_label }}.{{ rel.model }}"
                        data-app="{{ meta.app_label }}"
                        data-parent="{{ object.pk }}">
                    Load
                </button>

            </div>

            <div class="relation-container"
                 id="rel-{{ rel.model }}"
                 data-loaded="0">
                <small class="text-muted">
                    Click Load to fetch records
                </small>
            </div>

        </div>

        {% empty %}
        <div class="text-muted p-3">
            No linked records found.
        </div>
        {% endfor %}

    </div>

</div>
