# =========================================================
# 🧠 REDIS ADVANCED CONFIG (PRODUCTION TUNED)
# =========================================================

bind 0.0.0.0
port 6379

protected-mode yes

# ---------------------------------------------------------
# 💾 Persistence (AOF + RDB hybrid safety)
# ---------------------------------------------------------
appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

dir /data

dbfilename dump.rdb
appendfilename "appendonly.aof"

# ---------------------------------------------------------
# 🧠 Memory control (CRITICAL FOR CELERY STACKS)
# ---------------------------------------------------------
maxmemory 512mb
maxmemory-policy allkeys-lru

# ---------------------------------------------------------
# ⚡ Performance tuning
# ---------------------------------------------------------
tcp-keepalive 60
timeout 0
tcp-backlog 511

databases 16

# ---------------------------------------------------------
# 🔐 Security (basic hardening)
# ---------------------------------------------------------
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# ---------------------------------------------------------
# 📊 Logging
# ---------------------------------------------------------
loglevel notice
logfile ""

# ---------------------------------------------------------
# 🧵 Threading / I/O
# ---------------------------------------------------------
io-threads 2
io-threads-do-reads yes