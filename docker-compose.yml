x-django-common: &django-common
  image: qad-backend:latest

  build:
    context: .
    dockerfile: Dockerfile

  restart: unless-stopped

  stop_grace_period: 60s

  working_dir: /app

  env_file:
    - .env

  environment:

    DJANGO_SETTINGS_MODULE: qad.settings
    DEBUG: "False"
    HOSTNAME: ${HOSTNAME:-}
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONHASHSEED: "random"

    POSTGRES_HOST: pgbouncer
    POSTGRES_PORT: 6432

    REDIS_HOST: redis
    REDIS_PORT: 6379

    TZ: Africa/Nairobi

    WEB_CONCURRENCY: "4"
    GUNICORN_CMD_ARGS: >
      --worker-tmp-dir=/dev/shm
      --workers=4
      --threads=4
      --worker-class=gthread
      --max-requests=5000
      --max-requests-jitter=500
      --timeout=180
      --graceful-timeout=30
      --keep-alive=10
      --backlog=4096
      --access-logfile=-
      --error-logfile=-
      --capture-output
      --log-level=info

  volumes:
    - staticfiles:/app/staticfiles
    - media_data:/app/media
    - logs:/app/logs
    - tmp_data:/app/tmp

  depends_on:
    redis:
      condition: service_healthy

    pgbouncer:
      condition: service_healthy

  security_opt:
    - no-new-privileges:true

  tmpfs:
    - /dev/shm:size=1g
    - /tmp:size=1g

  ulimits:
    nofile:
      soft: 65535
      hard: 65535

    nproc:
      soft: 65535
      hard: 65535

  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G

      reservations:
        cpus: "0.50"
        memory: 512M

  logging:
    driver: json-file

    options:
      max-size: "100m"
      max-file: "10"
      compress: "true"

  healthcheck:
    disable: true

  networks:
    - frontend-network
    - backend-network


services:

  docker-proxy:
    image: alpine:latest
    container_name: qad-docker-proxy
    restart: unless-stopped
    command: sh -c "apk add --no-cache socat && socat TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend-network

  db:
    image: postgres:16-alpine

    container_name: qad-postgres

    restart: unless-stopped

    shm_size: "2gb"

    env_file:
      - .env

    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"

    command: >
      postgres
      -c max_connections=1000
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=300
      -c work_mem=16MB
      -c huge_pages=off
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c max_worker_processes=16
      -c max_parallel_workers_per_gather=8
      -c max_parallel_workers=16
      -c max_parallel_maintenance_workers=4
      -c tcp_keepalives_idle=60
      -c tcp_keepalives_interval=30
      -c tcp_keepalives_count=10

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres}"
        ]

      interval: 5s
      timeout: 5s
      retries: 30

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

    networks:
      - backend-network

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0

    container_name: qad-pgbouncer

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 5432

      POOL_MODE: transaction

      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 250
      MIN_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 50
      SERVER_RESET_QUERY: DISCARD ALL

    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-16432}:6432"

    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z 127.0.0.1 6432"
        ]

      interval: 10s
      timeout: 5s
      retries: 10

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    container_name: qad-redis
    restart: unless-stopped

    command: >
      redis-server
      --appendonly no
      --save ""
      --tcp-keepalive 60
      --timeout 0
      --databases 16
      --maxmemory 2gb
      --maxmemory-policy noeviction
      --io-threads 4
      --io-threads-do-reads yes

    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

    networks:
      - backend-network
  migrate:
    <<: *django-common

    container_name: qad-migrate

    restart: "no"

    user: root

    command: >
      sh -c "
      mkdir -p /app/media/exports &&
      mkdir -p /app/staticfiles &&
      chmod -R 777 /app/media &&
      chmod -R 777 /app/staticfiles &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput
      "

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      pgbouncer:
        condition: service_healthy

  web1:
    <<: *django-common

    container_name: qad-web1
    hostname: web1

    expose:
      - "8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      gunicorn qad.wsgi:application
      --bind 0.0.0.0:8000

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import socket; socket.create_connection((\"127.0.0.1\",8000),2)' || exit 1"
        ]

      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s


  web2:
    <<: *django-common

    container_name: qad-web2
    hostname: web2

    expose:
      - "8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      gunicorn qad.wsgi:application
      --bind 0.0.0.0:8000

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s


  web3:
    <<: *django-common

    container_name: qad-web3
    hostname: web3

    expose:
      - "8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      gunicorn qad.wsgi:application
      --bind 0.0.0.0:8000

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s


  web4:
    <<: *django-common

    container_name: qad-web4
    hostname: web4

    expose:
      - "8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      gunicorn qad.wsgi:application
      --bind 0.0.0.0:8000

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s


  daphne1:
    <<: *django-common

    container_name: qad-daphne1
    hostname: daphne1

    expose:
      - "8001"

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      daphne
      -b 0.0.0.0
      -p 8001
      --proxy-headers
      --access-log -
      qad.asgi:application

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health/ || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  daphne2:
    <<: *django-common

    container_name: qad-daphne2
    hostname: daphne2

    expose:
      - "8001"

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      daphne
      -b 0.0.0.0
      -p 8001
      --proxy-headers
      --access-log -
      qad.asgi:application

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health/ || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s


  daphne3:
    <<: *django-common

    container_name: qad-daphne3
    hostname: daphne3

    expose:
      - "8001"

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      daphne
      -b 0.0.0.0
      -p 8001
      --proxy-headers
      --access-log -
      qad.asgi:application

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health/ || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s


  celery1:
    <<: *django-common

    container_name: qad-celery1
    hostname: celery1

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      celery -A qad worker
      --loglevel=INFO
      --concurrency=8

    healthcheck:
      test: ["CMD-SHELL", "celery -A qad inspect ping --timeout=5 || exit 1"]

      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s



  celery2:
    <<: *django-common

    container_name: qad-celery2
    hostname: celery2

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      celery -A qad worker
      --loglevel=INFO
      --concurrency=8

    healthcheck:
      test: ["CMD-SHELL", "celery -A qad inspect ping --timeout=5 || exit 1"]

      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery3:
    <<: *django-common

    container_name: qad-celery3
    hostname: celery3

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      celery -A qad worker
      --loglevel=INFO
      --concurrency=8

    healthcheck:
      test: ["CMD-SHELL", "celery -A qad inspect ping --timeout=5 || exit 1"]

      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery4:
    <<: *django-common

    container_name: qad-celery4
    hostname: celery4

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      celery -A qad worker
      --loglevel=INFO
      --concurrency=8

    healthcheck:
      test: ["CMD-SHELL", "celery -A qad inspect ping --timeout=5 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s


  beat:
    <<: *django-common

    container_name: qad-beat

    hostname: beat

    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: >
      celery -A qad beat
      --loglevel=INFO
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --pidfile=/tmp/celerybeat.pid

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pgrep -f 'celery beat' || exit 1"
        ]

      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: qad-nginx:stable

    build:
      context: .
      dockerfile: Dockerfile.nginx

    container_name: qad-nginx

    restart: unless-stopped

    depends_on:
      web1:
        condition: service_started
        restart: true
      web2:
        condition: service_started
        restart: true
      web3:
        condition: service_started
        restart: true
      web4:
        condition: service_started
        restart: true
      daphne1:
        condition: service_started
        restart: true
      daphne2:
        condition: service_started
        restart: true
      daphne3:
        condition: service_started
        restart: true

    ports:
      - "8000:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - staticfiles:/staticfiles:ro
      - media_data:/media:ro

    environment:
      NGINX_TEMPLATE: /etc/nginx/templates/nginx.template

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ >/dev/null 2>&1 || exit 1"]

      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s


    networks:
      - frontend-network
      - backend-network

volumes:

  postgres_data:
    driver: local

  redis_data:
    driver: local

  staticfiles:
    driver: local

  media_data:
    driver: local

  logs:
    driver: local

  tmp_data:
    driver: local

networks:

  frontend-network:
    driver: bridge

  backend-network:
    driver: bridge
