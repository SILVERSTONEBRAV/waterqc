<nav class="ph-workspace-tabs" role="tablist" aria-label="pH adjustment workspace">
    <a class="ph-workspace-tab {% if request.GET.tab != 'reports' %}is-active{% endif %}" role="tab" aria-selected="{% if request.GET.tab != 'reports' %}true{% else %}false{% endif %}" href="{% url 'PHadjustment:dashboard' %}?plant={{ plant.pk }}&amp;tab=bench">
        <i class="fa-solid fa-flask-vial" aria-hidden="true"></i><span>pH bench</span>
    </a>
    <a class="ph-workspace-tab {% if request.GET.tab == 'reports' %}is-active{% endif %}" role="tab" aria-selected="{% if request.GET.tab == 'reports' %}true{% else %}false{% endif %}" href="{% url 'PHadjustment:dashboard' %}?plant={{ plant.pk }}&amp;tab=reports">
        <i class="fa-solid fa-chart-column" aria-hidden="true"></i><span>Adjustment reports</span>
    </a>
</nav>
