<aside class="sidebar collapsed" id="appSidebar">
  <nav class="sidebar-nav" aria-label="Shift Control dashboard">
    <ul class="sidebar-menu sc-dashboard-nav">
      <li class="sidebar-section-title"><span class="label">SHIFT CONTROL</span></li>
      {% for item in nav_items %}
        <li class="sidebar-item {% if selected_section == item.id %}active{% endif %}">
          <a href="{% url 'sc:dashboard' %}?{% if selected_plant %}plant={{ selected_plant.pk }}&amp;{% endif %}section={{ item.id }}#{{ item.id }}"
             class="nav-link" title="{{ item.label }}" aria-label="{{ item.label }}">
            <i class="fas fa-{{ item.icon }} sidebar-icon" aria-hidden="true"></i>
            <span class="label">{{ item.label }}</span>
          </a>
        </li>
      {% endfor %}
      <li class="sidebar-section-title"><span class="label">QUICK ACTIONS</span></li>
      <li class="sidebar-item">
        <a href="{% url 'sc:dashboard' %}?{% if selected_plant %}plant={{ selected_plant.pk }}&amp;{% endif %}section=handovers#handovers" class="nav-link" title="Review handovers">
          <i class="fas fa-inbox sidebar-icon" aria-hidden="true"></i><span class="label">Review handovers</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="{% url 'sc:dashboard' %}?{% if selected_plant %}plant={{ selected_plant.pk }}&amp;{% endif %}section=staffing#staffing" class="nav-link" title="Review staffing gaps">
          <i class="fas fa-triangle-exclamation sidebar-icon" aria-hidden="true"></i><span class="label">Staffing gaps</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
