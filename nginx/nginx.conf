# =========================================================
# 🚀 NGINX CORE (DOCKER + DJANGO + DAPHNE HARDENED)
# =========================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

# =========================================================
# EVENTS
# =========================================================
events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

# =========================================================
# HTTP CORE
# =========================================================
http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    server_tokens off;

    # =====================================================
    # CORE NETWORKING
    # =====================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    keepalive_requests 10000;

    reset_timedout_connection on;

    # =====================================================
    # CLIENT LIMITS
    # =====================================================
    client_max_body_size 100M;

    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    client_body_buffer_size 128k;
    client_header_buffer_size 4k;

    large_client_header_buffers 4 16k;

    # =====================================================
    # HASH TABLES
    # =====================================================
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    # =====================================================
    # SECURITY HEADERS
    # =====================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # =====================================================
    # PROXY DEFAULTS
    # =====================================================
    proxy_http_version 1.1;

    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    proxy_request_buffering on;
    proxy_redirect off;

    proxy_buffering on;
    proxy_buffer_size 64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;

    # =====================================================
    # REAL IP
    # =====================================================
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # =====================================================
    # LOGGING
    # =====================================================
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'xff="$http_x_forwarded_for" '
                    'host="$host" rt=$request_time '
                    'ua="$upstream_addr" us="$upstream_status" '
                    'ut="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # =====================================================
    # GZIP
    # =====================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;

    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # =====================================================
    # STATIC FILE CACHE
    # =====================================================
    open_file_cache max=200000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # =====================================================
    # DOCKER DNS
    # =====================================================
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # =====================================================
    # WEBSOCKETS
    # =====================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =====================================================
    # RATE LIMITING
    # =====================================================
    limit_req_zone $binary_remote_addr zone=global_limit:20m rate=60r/s;

    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=30r/s;

    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # =====================================================
    # TEMP PATHS
    # =====================================================
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    # =====================================================
    # LOAD SERVER CONFIGS
    # =====================================================
    include /etc/nginx/conf.d/*.conf;
}