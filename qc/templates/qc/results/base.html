{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}QC Analytical Dashboard{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Water Quality Control - Real-time Analytical Results & Telemetry Dashboard">

    <!-- Progressive Web Application Meta -->
    <link rel="manifest" href="{% static 'qc/results/manifest.json' %}">
    <meta name="theme-color" content="#0a0f1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QC Analytics">

    <!-- Modern Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Base Design Systems -->
    <link rel="stylesheet" href="{% static 'core/css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'qc/results/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'qc/results/css/excell.css' %}">
    <link rel="stylesheet" href="{% static 'qc/results/css/dashboard_v2.css' %}?v=20261012_v3">

    <!-- Core Scripts -->
    <script src="{% static 'ca/js/htmx.js' %}"></script>
    <script>if (typeof window.htmx === "undefined") { document.write('<script src="https://unpkg.com/htmx.org@1.9.12"><\/script>'); }</script>
    <script src="{% static 'core/js/theme.js' %}" defer></script>
    <script src="{% static 'core/js/fullscreen.js' %}" defer></script>
    <script src="{% static 'qc/results/js/result_card.js' %}?v=20261012_v3" defer></script>

    {% block extra_head %}{% endblock %}
</head>

<body class="base-body dashboard-fullscreen"
      {% if plant %}data-plant-id="{{ plant.pk }}"{% endif %}>

    <div class="dashboard-page">

        {% include "qc/results/components/header.html" %}

        <div id="main-dashboard" class="main-dashboard fullwidth-workspace">
            <main id="workspace" class="dashboard-workspace">
                {% block content %}{% endblock %}
            </main>
        </div>

    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
