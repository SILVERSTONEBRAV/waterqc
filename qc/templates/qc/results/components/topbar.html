{% if cards %}

{% with card=cards.0 %}

<div id="analysis-topbar"
     class="sticky top-0 z-50 mb-6 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-lg backdrop-blur">

    <div class="bg-gradient-to-r from-slate-50 via-white to-blue-50 px-8 py-6">

        <div class="flex flex-col gap-6 xl:flex-row xl:items-center xl:justify-between">

            <div class="space-y-3">

                <div class="flex flex-wrap items-center gap-4">

                    <h1 class="text-3xl font-bold tracking-tight text-slate-900">
                        {{ card.time_label }} Analysis
                    </h1>

                </div>
            </div>
        </div>
    </div>
</div>
{% endwith %}
{% endif %}
