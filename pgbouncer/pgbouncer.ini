# =========================================================
# ⚡ PgBouncer Configuration — Advanced for Django/Postgres
# =========================================================

[databases]
# Direct connection to Postgres
qaddb = host=db port=5432 dbname=qaddb user=postgres password=Tatiana2024*

# =========================================================
# 🛡️ PgBouncer Settings
# =========================================================
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# --- Authentication ---
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# --- Pooling Mode ---
# Django ORM requires session pooling for stability
pool_mode = session

# --- Connection Limits ---
max_client_conn = 500
default_pool_size = 50
reserve_pool_size = 20
reserve_pool_timeout = 5

# --- Timeouts ---
server_idle_timeout = 300
query_timeout = 600
client_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 10

# --- Connection Reset ---
server_reset_query = DISCARD ALL
server_reset_query_always = 1

# --- Logging & Stats ---
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

# --- TLS/SSL (optional, if you enable SSL in Postgres) ---
# client_tls_sslmode = prefer
# client_tls_key_file = /etc/pgbouncer/client.key
# client_tls_cert_file = /etc/pgbouncer/client.crt
# client_tls_ca_file = /etc/pgbouncer/ca.crt

# --- Admin Console ---
admin_users = postgres
