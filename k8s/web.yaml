apiVersion: apps/v1
kind: Deployment
metadata:
  name: qad-web
  namespace: qad
spec:
  replicas: 2

  selector:
    matchLabels:
      app: qad-web

  progressDeadlineSeconds: 120
  revisionHistoryLimit: 3

  template:
    metadata:
      labels:
        app: qad-web

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: web
          image: qad-backend:stable
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: qad-config
            - secretRef:
                name: qad-secrets

          command: ["gunicorn"]
          args:
            - qad.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "3"
            - --timeout
            - "60"

          startupProbe:
            httpGet:
              path: /health/live/
              port: 8000
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health/ready/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health/live/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: qad-web
  namespace: qad
spec:
  selector:
    app: qad-web
  ports:
    - port: 80
      targetPort: 8000
