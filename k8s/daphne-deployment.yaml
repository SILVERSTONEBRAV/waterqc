apiVersion: apps/v1
kind: Deployment
metadata:
  name: qad-daphne
  namespace: qad
spec:
  replicas: 2

  selector:
    matchLabels:
      app: qad-daphne

  template:
    metadata:
      labels:
        app: qad-daphne

    spec:
      containers:
        - name: daphne
          image: qad-backend:stable

          ports:
            - containerPort: 8001

          envFrom:
            - configMapRef:
                name: qad-config

            - secretRef:
                name: qad-secrets

          command:
            - daphne

          args:
            - -b
            - 0.0.0.0
            - -p
            - "8001"
            - qad.asgi:application

---
apiVersion: v1
kind: Service
metadata:
  name: qad-daphne
  namespace: qad
spec:
  selector:
    app: qad-daphne

  ports:
    - port: 8001
      targetPort: 8001
