# Copy to secrets.yaml locally, replace every placeholder, and provision through
# your cluster secret manager. Never apply this template with placeholder values.
apiVersion: v1
kind: Secret
metadata:
  name: qad-secrets
  namespace: qad
type: Opaque
stringData:
  SECRET_KEY: "replace-with-a-long-random-django-secret"
  POSTGRES_PASSWORD: "replace-with-the-database-password"
  DATABASE_URL: "postgresql://qad:replace-with-the-database-password@pgbouncer:6432/qad"
  # PgBouncer md5 format is md5 + hex(md5(password + username)).
  userlist.txt: |
    "qad" "md5replace-with-generated-hash"
