apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: qad
data:
  pgbouncer.ini: |
    [databases]
    qad = host=postgres port=5432 dbname=qad

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432

    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt

    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 20

    reserve_pool_size = 5
    reserve_pool_timeout = 5

    server_reset_query = DISCARD ALL
    ignore_startup_parameters = extra_float_digits

    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1

    # Stability tuning
    server_lifetime = 3600
    server_idle_timeout = 600
    client_idle_timeout = 0

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-users
  namespace: qad
data:
  userlist.txt: |
    "qad" "md5REPLACE_WITH_HASH"

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: qad
spec:
  selector:
    app: pgbouncer
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: qad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 6432

          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: qad
            - name: DB_USER
              value: qad
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qad-secrets
                  key: POSTGRES_PASSWORD

          # IMPORTANT FIX:
          # NO directory mount for /etc/pgbouncer
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true

            - name: users
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
              readOnly: true

          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

      restartPolicy: Always

      volumes:
        - name: config
          configMap:
            name: pgbouncer-config

        - name: users
          configMap:
            name: pgbouncer-users