apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: qad
spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: redis:7-bookworm
          imagePullPolicy: IfNotPresent

          command:
            - redis-server
            - --appendonly
            - "yes"

          ports:
            - containerPort: 6379

          volumeMounts:
            - mountPath: /data
              name: redis-storage

          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5

          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15

      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: qad
spec:
  selector:
    app: redis

  ports:
    - port: 6379
      targetPort: 6379