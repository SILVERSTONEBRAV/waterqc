apiVersion: v1
kind: ConfigMap
metadata:
  name: qad-config
  namespace: qad
data:
  DJANGO_SETTINGS_MODULE: "qad.settings"
  ENVIRONMENT: "production"
  DEBUG: "False"

  ALLOWED_HOSTS: "*"

  POSTGRES_DB: "qad"
  POSTGRES_USER: "qad"

  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  PGBOUNCER_HOST: "pgbouncer"
  PGBOUNCER_PORT: "6432"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  DATABASE_URL: "postgresql://qad:qadpassword@pgbouncer:6432/qad"

  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"

  STATIC_ROOT: "/app/staticfiles"
  MEDIA_ROOT: "/app/media"

  GUNICORN_WORKERS: "4"
  GUNICORN_THREADS: "2"

  TZ: "Africa/Nairobi"