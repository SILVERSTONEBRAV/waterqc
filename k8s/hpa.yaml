apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qad-web-hpa
  namespace: qad
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qad-web

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70