apiVersion: apps/v1
kind: Deployment
metadata:
  name: qad-beat
  namespace: qad
spec:
  replicas: 1

  selector:
    matchLabels:
      app: qad-beat

  template:
    metadata:
      labels:
        app: qad-beat

    spec:
      containers:
        - name: beat
          image: qad-backend:stable

          envFrom:
            - configMapRef:
                name: qad-config

            - secretRef:
                name: qad-secrets

          command:
            - celery

          args:
            - -A
            - qad
            - beat
            - --loglevel=info
