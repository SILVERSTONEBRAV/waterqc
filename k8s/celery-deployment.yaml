apiVersion: apps/v1
kind: Deployment
metadata:
  name: qad-celery
  namespace: qad
spec:
  replicas: 2

  selector:
    matchLabels:
      app: qad-celery

  template:
    metadata:
      labels:
        app: qad-celery

    spec:
      containers:
        - name: celery
          image: qad-backend:latest

          envFrom:
            - configMapRef:
                name: qad-config

            - secretRef:
                name: qad-secrets

          command:
            - celery

          args:
            - -A
            - qad
            - worker
            - --loglevel=info
            - --concurrency=4