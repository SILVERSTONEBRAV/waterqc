<aside class="sidebar collapsed scada-sidebar" id="appSidebar">
    <nav class="sidebar-nav" aria-label="Chemical operations dashboard">
        <ul class="sidebar-menu">
            <li class="sidebar-section-title"><span class="label">OPERATIONS SCADA</span></li>
            {% for key, label, icon, dose_filter in nav_items %}
            <li class="sidebar-item"><a href="#{{ key }}" class="nav-link scada-sidebar-link{% if dose_filter %} scada-dose-filter{% endif %}" data-target="{{ key }}"{% if dose_filter %} data-dose-filter="{{ dose_filter }}"{% endif %} title="{{ label }}" aria-label="{{ label }}"><i class="fas {{ icon }} sidebar-icon" aria-hidden="true"></i><span class="label">{{ label }}</span></a></li>
            {% endfor %}
        </ul>
    </nav>
</aside>
