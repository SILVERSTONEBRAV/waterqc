{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nairobi City Water & Sewerage</title>

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" href="{% static 'image/favicon.ico' %}" type="image/x-icon">

    <!-- Login-specific styles -->
    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
</head>
<body>

<!-- =============================
     Floating error container
     ============================= -->
<div id="errorMessage" class="error-message" aria-live="assertive">
    {% if error %}{{ error }}{% endif %}
</div>

<!-- =============================
     Login Wrapper for animations / gradient
     ============================= -->
<div id="loginWrapper" class="login-wrapper">

    <!-- =============================
         Login Card
         ============================= -->
    <div class="login-container">

        <!-- Company Branding / Logo -->
        <div id="companyBrandingWrapper" data-logo="{% static 'accounts/images/ncwsc_logo.png' %}">
            {% include 'accounts/components/company_branding.html' %}
        </div>

        <!-- Verified username display (shown after verification) -->
        <div id="verifiedUsername" class="verified-username" style="display:none;"></div>

        <!-- Username Input -->
        <div class="form-group" id="usernameGroup">
            <i class="fas fa-user left-icon" aria-hidden="true"></i>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Username"
                   value="{{ username|default:'' }}"
                   autocomplete="off"
                   spellcheck="false"
                   aria-label="Username">
        </div>

        <!-- Verify Username Button -->
        <button type="button"
                id="verifyBtn"
                data-url="{% url 'accounts:check_username' %}"
                data-csrf="{{ csrf_token }}">
            Verify Username
        </button>

        <!-- Password Form (hidden until username verified) -->
        <form id="loginForm"
              method="post"
              action="{% url 'accounts:login' %}"
              style="width:100%; display:flex; flex-direction:column; gap:8px; margin-top:10px;">

            {% csrf_token %}

            <div class="form-group password-container"
                 id="passwordGroup"
                 style="display:none;">
                <i class="fas fa-lock left-icon" aria-hidden="true"></i>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Password"
                       autocomplete="new-password"
                       aria-label="Password">

                <i class="fas fa-eye toggle-password"
                   id="togglePassword"
                   aria-label="Toggle password visibility"
                   role="button"
                   tabindex="0"></i>
            </div>

            <!-- Password Strength Meter -->
            <div id="passwordStrengthContainer" style="display:none;">
                <div id="passwordStrengthBar"></div>
            </div>

            <button type="submit"
                    id="loginBtn"
                    class="ripple"
                    disabled
                    style="display:none;">
                Login
            </button>
        </form>

        <!-- Forgot Password -->
        <div class="forgot-password" id="forgotDiv" style="display:none;">
            <a href="{% url 'accounts:reset_password_request' %}">
                Forgot your password?
            </a>
        </div>

    </div>
</div>

<!-- =============================
     Login JS
     ============================= -->
<script src="{% static 'accounts/js/login.js' %}"></script>

<!-- Optional: Dynamic gradient based on logo colors -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const wrapper = document.getElementById('companyBrandingWrapper');
    const loginContainer = document.querySelector('.login-container');

    if (wrapper && wrapper.dataset.logo) {
        // Placeholder for future color extraction from logo
        // e.g., use Color Thief or Vibrant.js
        // const img = new Image();
        // img.src = wrapper.dataset.logo;
        // img.onload = () => {
        //     const colors = extractColors(img);
        //     loginContainer.style.background = `linear-gradient(135deg, ${colors.join(',')})`;
        //     loginContainer.classList.add('dynamic-gradient');
        // };
    }
});
</script>

{% if error %}
<script>
    // Show server-side error on load
    document.addEventListener('DOMContentLoaded', () => {
        const err = document.getElementById('errorMessage');
        if (err && err.textContent.trim()) {
            err.classList.add('show');
            setTimeout(() => err.classList.remove('show'), 4000);
        }
    });
</script>
{% endif %}

</body>
</html>
