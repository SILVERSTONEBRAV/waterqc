{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NCWSCwaterLAB">
    <title>Login | Nairobi City Water & Sewerage</title>
    <link rel="manifest" href="/manifest.json?v=20261020-enterprise-theme">
    <meta name="theme-color" content="#417690">
    <script src="{% static 'core/js/theme.js' %}?v=20261020-enterprise-theme"></script>
    <script>document.documentElement.classList.remove('fullscreen-app');</script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="{% static 'css/font_awesome/all.min.css' %}">

    <!-- Favicon -->
    {% if company.logo %}
    <link rel="apple-touch-icon" href="{{ company.logo.url }}">
    <link rel="icon" href="{{ company.logo.url }}">
    {% elif company.favicon %}
    <link rel="apple-touch-icon" href="{{ company.favicon.url }}">
    <link rel="icon" href="{{ company.favicon.url }}" type="image/png">
    {% else %}
    <link rel="apple-touch-icon" href="{% static 'image/apple-touch-icon.png' %}">
    <link rel="icon" href="{% static 'image/logo.ico' %}" type="image/x-icon">
    {% endif %}

    <link rel="stylesheet" href="{% static 'core/css/theme.css' %}?v=20261020-enterprise-theme">
    <!-- Login-specific layout, using the shared theme tokens. -->
    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}?v=20261025-standard-login">
</head>
<body>

<!-- =============================
     Floating error container
     ============================= -->
<div id="errorMessage" class="error-message" aria-live="assertive">
    {% if error %}{{ error }}{% endif %}
</div>

<!-- =============================
     Login Wrapper for animations / gradient
     ============================= -->
<div id="loginWrapper" class="login-wrapper">

    <!-- =============================
         Login Card
         ============================= -->
    <div class="login-container">

        <!-- Company Branding / Logo -->
        <div id="companyBrandingWrapper" data-logo="{% if company.logo %}{{ company.logo.url }}{% else %}{% static 'accounts/images/ncwsc_logo.png' %}{% endif %}">
            {% include 'accounts/components/company_branding.html' %}
        </div>

        <!-- Standard Login Form — username + password visible together -->
        <form id="loginForm"
              method="post"
              action="{% url 'accounts:login' %}"
              autocomplete="off"
              style="width:100%; display:flex; flex-direction:column; gap:8px; margin-top:10px;">

            {% csrf_token %}

            <!-- Username Input -->
            <div class="form-group" id="usernameGroup">
                <i class="fas fa-user left-icon" aria-hidden="true"></i>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Username"
                       autocomplete="off"
                       spellcheck="false"
                       aria-label="Username">
            </div>

            <!-- Password Input -->
            <div class="form-group password-container" id="passwordGroup">
                <i class="fas fa-lock left-icon" aria-hidden="true"></i>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Password"
                       autocomplete="off"
                       aria-label="Password">

                <i class="fas fa-eye toggle-password"
                   id="togglePassword"
                   aria-label="Toggle password visibility"
                   role="button"
                   tabindex="0"></i>
            </div>

            <button type="submit"
                    id="loginBtn"
                    class="ripple">
                Login
            </button>
        </form>

        <!-- Forgot Password (AJAX trigger) -->
        <div class="forgot-password" id="forgotDiv">
            <a href="#" id="forgotPasswordLink"
               data-url="{% url 'accounts:reset_password_request' %}">
                Forgot your password?
            </a>
        </div>
        <!-- Reset email status message -->
        <div id="resetMessage" class="reset-status" style="display:none;"></div>

    </div>
</div>

<!-- =============================
     Login JS
     ============================= -->
<script src="{% static 'accounts/js/login.js' %}?v=20261027-clear-login"></script>

{% if error %}
<script>
    // Show server-side error on load
    document.addEventListener('DOMContentLoaded', () => {
        const err = document.getElementById('errorMessage');
        if (err && err.textContent.trim()) {
            err.classList.add('show');
            setTimeout(() => err.classList.remove('show'), 4000);
        }
    });
</script>
{% endif %}

<script src="{% static 'core/js/pwa.js' %}?v=20261027-no-auto-logout" defer></script>
</body>
</html>
