<div class="dropdown-wrapper user-dropdown" data-dropdown="user">
    <button
        id="userMenuBtn"
        class="dropdown-toggle user-menu-trigger"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="userDropdown">
        <span class="avatar-wrapper">
            <img
                src="{{ request.user.profile_picture_url }}"
                alt="{{ request.user.username }} profile"
                class="avatar"
                loading="lazy">
            <span class="status-dot online" aria-hidden="true"></span>
        </span>
        <span class="user-trigger-meta">
            <span class="user-name">{{ request.user.full_name }}</span>
            <span class="user-role-label">{{ user_role_summary|default:"General User" }}</span>
        </span>
        <i class="fas fa-chevron-down user-menu-chevron" aria-hidden="true"></i>
    </button>
</div>
