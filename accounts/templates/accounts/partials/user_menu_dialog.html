<dialog id="userDropdown" class="user-menu-dialog" aria-labelledby="userMenuDialogTitle">
    <section class="user-menu-card">
        <header class="user-menu-card__header">
            <img
                src="{{ request.user.profile_picture_url }}"
                alt=""
                class="user-menu-card__avatar"
                loading="lazy">
            <div class="user-menu-card__identity">
                <h2 id="userMenuDialogTitle">{{ request.user.full_name }}</h2>
                <p>{{ user_role_summary|default:"General User" }}{% if request.user.email %}<span aria-hidden="true"> · </span>{{ request.user.email }}{% endif %}</p>
            </div>
            <button type="button" class="user-menu-card__close" data-close-user-menu aria-label="Close user menu">
                <i class="fas fa-xmark" aria-hidden="true"></i>
            </button>
        </header>

        <nav aria-label="Account menu">
            <ul class="user-menu-actions" role="menu">
                <li role="none">
                    <a href="{% url 'accounts:profile' %}" role="menuitem">
                        <i class="fas fa-user" aria-hidden="true"></i><span>My Profile</span>
                    </a>
                </li>
                <li role="none">
                    <a href="{% url 'accounts:profile_picture_update' %}" role="menuitem">
                        <i class="fas fa-image" aria-hidden="true"></i><span>Change Picture</span>
                    </a>
                </li>
                <li role="none">
                    <a href="{% url 'accounts:change_password' %}" role="menuitem">
                        <i class="fas fa-key" aria-hidden="true"></i><span>Change Password</span>
                    </a>
                </li>

                {% if user_can_administer_accounts %}
                <li class="user-menu-divider" role="separator"></li>
                <li role="none">
                    <a href="{% url 'accounts:user_list' %}" role="menuitem">
                        <i class="fas fa-users" aria-hidden="true"></i><span>Manage Users</span>
                    </a>
                </li>
                {% endif %}

                <li class="user-menu-divider" role="separator"></li>
                <li role="none">
                    <a href="{% url 'accounts:logout' %}" class="user-menu-action--logout" role="menuitem">
                        <i class="fas fa-right-from-bracket" aria-hidden="true"></i><span>Logout</span>
                    </a>
                </li>
            </ul>
        </nav>
    </section>
</dialog>
