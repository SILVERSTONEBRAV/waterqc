{% load static %}

<div
    id="changePasswordModal"
    class="app-modal app-modal--corner"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="changePasswordTitle">

    <div class="app-modal__backdrop"
         data-action="close-password-modal"></div>

    <div class="app-modal__panel password-modal--xs"
         role="document">

        <!-- HEADER (MINIMAL) -->
        <div class="app-modal__header compact-header">

            <h4 id="changePasswordTitle" class="app-modal__title">
                <i class="fas fa-key"></i>
                <span>Change Password</span>
            </h4>

        </div>

        <!-- FORM -->
        <form
            method="post"
            id="change-password-form"
            class="app-modal__body compact-form"
            autocomplete="off">

            {% csrf_token %}

            <!-- CURRENT PASSWORD -->
            <div class="compact-field">

                <div class="field-inner">

                    <span class="field-icon">
                        <i class="fas fa-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="old_password"
                        name="old_password"
                        placeholder="Current password"
                        autocomplete="current-password"
                        required>

                    <button type="button"
                            class="password-toggle"
                            data-toggle-password="#old_password">
                        <i class="fas fa-eye"></i>
                    </button>

                </div>

            </div>

            <!-- NEW PASSWORD -->
            <div class="compact-field">

                <div class="field-inner">

                    <span class="field-icon">
                        <i class="fas fa-key"></i>
                    </span>

                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="New password"
                        autocomplete="new-password"
                        required>

                    <button type="button"
                            class="password-toggle"
                            data-toggle-password="#new_password">
                        <i class="fas fa-eye"></i>
                    </button>

                </div>

                <div class="password-strength mini">
                    <div class="strength-bar">
                        <div id="passwordStrengthFill"></div>
                    </div>
                </div>

            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="compact-field">

                <div class="field-inner">

                    <span class="field-icon">
                        <i class="fas fa-check-circle"></i>
                    </span>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                        required>

                    <button type="button"
                            class="password-toggle"
                            data-toggle-password="#confirm_password">
                        <i class="fas fa-eye"></i>
                    </button>

                </div>

                <small id="passwordMatchMessage"></small>

            </div>

            <!-- ACTION -->
            <div class="app-modal__footer compact-footer">

                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="fas fa-save"></i>
                    Save
                </button>

            </div>

        </form>

    </div>
</div>
