{% extends "accounts/base.html" %}
{% block content %}
<h2>Delete User</h2>

<p>Are you sure you want to delete user <strong>{{ object.username }}</strong> ({{ object.full_name }})?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'accounts:user_list' %}" class="btn btn-light">Cancel</a>
</form>
{% endblock %}
